<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salama Dar: ramani ya uelewa wa mafuriko</title>
<meta name="description" content="Ramani ya uelewa wa mafuriko Dar es Salaam: kata zenye historia ya mafuriko, jinsi ya kujiandaa, afya, na namba za dharura.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --fill:rgba(118,118,128,.12); --raised:#FFFFFF;
  --material:rgba(249,249,251,.80); --sep:rgba(60,60,67,.16);
  --ink:#1D1D1F; --ink-2:#636366; --rule:rgba(60,60,67,.22); --rule-2:rgba(60,60,67,.12);
  --blue:#0071E3; --blue-tint:rgba(0,113,227,.12); --link:#005FBF;
  --land:#F4F1EA; --land-other:#ECEAE4; --sea:#AFD5F5; --ward-line:#FFFFFF; --district-line:#8E8E93;
  --flood:#F2662B; --plan:#FFC53D; --sel:#0071E3; --em:#D70015; --ok:#1E7B34; --hl:#0071E3;
  --frame:#0B4F9C; --frame-text:#FFFFFF; --cta:#FFFFFF; --cta-ink:#0058B0;
  --sh1:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.05);
  --sh2:0 12px 36px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --r-l:16px; --r-m:12px; --r-s:9px;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --raised:#2C2C2E;
    --material:rgba(28,28,30,.78); --sep:rgba(84,84,88,.55);
    --ink:#F5F5F7; --ink-2:#A1A1A6; --rule:rgba(84,84,88,.65); --rule-2:rgba(84,84,88,.4);
    --blue:#0071E3; --blue-tint:rgba(41,151,255,.22); --link:#4DA3FF;
    --land:#2C2C2E; --land-other:#232325; --sea:#0D2B4A; --ward-line:#3A3A3C; --district-line:#8E8E93;
    --flood:#FF7A45; --plan:#B8862B; --sel:#4DA3FF; --em:#FF6961; --ok:#4CD964; --hl:#4DA3FF;
    --frame:#0A3B73; --frame-text:#FFFFFF; --cta:#FFFFFF; --cta-ink:#0058B0;
    --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 12px 36px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --raised:#2C2C2E;
  --material:rgba(28,28,30,.78); --sep:rgba(84,84,88,.55);
  --ink:#F5F5F7; --ink-2:#A1A1A6; --rule:rgba(84,84,88,.65); --rule-2:rgba(84,84,88,.4);
  --blue:#0071E3; --blue-tint:rgba(41,151,255,.22); --link:#4DA3FF;
  --land:#2C2C2E; --land-other:#232325; --sea:#0D2B4A; --ward-line:#3A3A3C; --district-line:#8E8E93;
  --flood:#FF7A45; --plan:#B8862B; --sel:#4DA3FF; --em:#FF6961; --ok:#4CD964; --hl:#4DA3FF;
  --frame:#0A3B73; --frame-text:#FFFFFF; --cta:#FFFFFF; --cta-ink:#0058B0;
  --sh1:0 1px 2px rgba(0,0,0,.5); --sh2:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.47;letter-spacing:-.01em;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px;border-radius:6px}
p{margin:0 0 .8em}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;letter-spacing:-.02em}
h2{font-size:1.3rem} h3{font-size:1.05rem}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.sw.rep{background:var(--flood)} .sw.plan{background:var(--plan)} .sw.none{background:var(--land);outline:1px solid var(--rule)}
.sw.rpt{background:var(--blue);border-radius:50%}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* iOS-style icon badge: white glyph on a coloured rounded square */
.ib{display:grid;place-items:center;flex:0 0 auto;width:32px;height:32px;border-radius:8px;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,#0071E3) 78%,#fff),var(--c,#0071E3));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.ib svg{width:20px;height:20px}
.ib.lg{width:44px;height:44px;border-radius:11px}
.ib.lg svg{width:26px;height:26px}
.wx{flex:0 0 auto;display:block}
.c-blue{--c:#0A84FF} .c-green{--c:#30B94D} .c-orange{--c:#FF9500} .c-red{--c:#FF3B30} .c-teal{--c:#30B0C7} .c-indigo{--c:#5856D6} .c-pink{--c:#FF2D55} .c-yellow{--c:#E5A400} .c-gray{--c:#8E8E93} .c-purple{--c:#AF52DE}

/* ---------- App shell ---------- */
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:56px;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);position:relative;z-index:30;border-bottom:.5px solid var(--sep)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand:hover{text-decoration:none}
.logo{width:34px;height:34px;flex:0 0 auto;display:block;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.brand-text{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.wordmark{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:-.02em;white-space:nowrap}
.proto{font-size:.72rem;color:var(--ink-2);white-space:nowrap}
.topnav{display:none;gap:2px;margin-left:24px}
.topnav a{text-decoration:none;padding:7px 14px;border-radius:999px;color:var(--ink-2);font-size:.95rem}
.topnav a[aria-current="page"]{color:var(--blue);background:var(--blue-tint);font-weight:600}
:root[data-theme="dark"] .topnav a[aria-current="page"]{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topnav a[aria-current="page"]{color:var(--link)}}
.bar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;background:var(--fill);border-radius:999px;cursor:pointer;padding:0;color:var(--blue)}
:root[data-theme="dark"] .iconbtn{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .iconbtn{color:var(--link)}}
.lang{display:inline-flex;flex:0 0 auto;background:var(--fill);border-radius:9px;padding:2px}
.lang button{background:transparent;border:0;padding:5px 12px;min-height:36px;min-width:46px;cursor:pointer;font-size:.86rem;border-radius:7px;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--raised);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.strip{display:none}
.offline{background:#3A3A3C;color:#fff;font-size:.86rem;padding:7px 14px;text-align:center}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none}
.view.enter .page{animation:rise .24s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{max-width:720px;margin:0 auto;padding:18px 16px 48px}
.page>h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1.1;letter-spacing:-.03em;margin:4px 4px 8px}
.lead{color:var(--ink-2);max-width:62ch;margin:0 4px 18px}
.card{background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh1)}
.group-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2);margin:26px 16px 7px;font-weight:400}
.tabbar{display:grid;grid-template-columns:repeat(6,1fr);background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);flex:0 0 auto;z-index:30;padding:5px 2px 2px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;text-decoration:none;font-size:.68rem;font-weight:500;color:#5E5E63;letter-spacing:0}
:root[data-theme="dark"] .tabbar a{color:#98989F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar a{color:#98989F}}
.tab-ic{display:grid;place-items:center;width:30px;height:28px}
.tab-ic svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--link)}
:root[data-theme="dark"] .tabbar a[aria-current="page"]{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar a[aria-current="page"]{color:var(--link)}}
.tabbar a[aria-current="page"] .tab-ic svg path,.tabbar a[aria-current="page"] .tab-ic svg rect,.tabbar a[aria-current="page"] .tab-ic svg circle{stroke-width:2.2}
.tabbar a.alert,:root[data-theme="dark"] .tabbar a.alert{color:var(--em)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabbar a.alert{color:var(--em)}}
@media (min-width:900px){
  .topnav{display:flex} .tabbar{display:none}
  .bar{padding:8px 24px}
  .page>h1{font-size:2.5rem}
}

/* ---------- Map ---------- */
.v-map{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.v-map{grid-template-columns:minmax(0,1fr) 400px}}
.mapwrap{position:relative;min-height:0;height:100%;overflow:hidden;background:var(--sea)}
.mapbox{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapbox.dragging{cursor:grabbing}
#map{display:block;width:100%;height:100%}
#map .sea{fill:var(--sea)} #map .other{fill:var(--land-other)}
#map .w{fill:var(--land);stroke:var(--ward-line);stroke-width:.8px;vector-effect:non-scaling-stroke;cursor:pointer;transition:filter .12s}
#map .w.plan{fill:var(--plan)} #map .w.rep{fill:var(--flood)}
@media (hover:hover){#map .w:hover{filter:brightness(.94)}}
#map .dist{fill:none;stroke:var(--district-line);stroke-width:1px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.8}
#map .selp{fill:none;stroke:var(--sel);stroke-width:3px;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
#map text{pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;fill:var(--ink);font-family:var(--body);font-weight:600}
#map text.dl{font-weight:400;fill:var(--ink-2)}
#map text.sl{font-style:italic;font-weight:400;fill:#3B6E9C;stroke:var(--sea)}
:root[data-theme="dark"] #map text.sl{fill:#7FA9D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #map text.sl{fill:#7FA9D6}}
#map .bub circle{fill:var(--blue);stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:2px}
#map .bub text{fill:#fff;stroke:none;font-weight:700}
.mtop{position:absolute;left:10px;right:10px;top:10px;z-index:8;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mtop>*{pointer-events:auto}
@media (min-width:900px){.mtop{right:auto;width:min(420px,calc(100% - 90px))}}
.combo{position:relative}
.combo input{width:100%;font-size:1rem;padding:11px 14px 11px 40px;border:0;border-radius:12px;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);min-height:46px;box-shadow:var(--sh2);-webkit-appearance:none;appearance:none}
.combo input::-webkit-search-cancel-button{-webkit-appearance:none}
.combo input::placeholder{color:var(--ink-2)}
.combo .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-2);z-index:2}
.combo ul{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);margin:0;padding:4px 0;list-style:none;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px;max-height:min(340px,50vh);overflow:auto;box-shadow:var(--sh2)}
.combo li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;min-height:46px;border-bottom:.5px solid var(--sep)}
.combo li:last-child{border-bottom:0}
.combo li[aria-selected="true"],.combo li:hover{background:var(--blue-tint)}
.combo li small{color:var(--ink-2)}
.combo .empty{color:var(--ink-2);cursor:default}
.legend{display:flex;gap:6px;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend li{display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:999px;padding:6px 11px;font-size:.78rem;min-height:32px;box-shadow:var(--sh1)}
.legend li.lnk{padding:0;background:var(--blue)}
.legend a{display:flex;align-items:center;gap:6px;min-height:32px;padding:6px 12px;font-weight:600;color:#fff}
.legend a:hover{text-decoration:none}
.ctrls{position:absolute;right:10px;top:122px;display:flex;flex-direction:column;z-index:7;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:12px;box-shadow:var(--sh2);overflow:hidden}
@media (min-width:900px){.ctrls{top:10px}}
.ctrls button{width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;border-bottom:.5px solid var(--sep);cursor:pointer;padding:0;color:var(--ink)}
.ctrls button:last-child{border-bottom:0}

/* ---------- Panel / sheet ---------- */
.panel{background:var(--surface);display:flex;flex-direction:column;min-height:0}
.sheet-head{display:flex;align-items:center;gap:10px;padding:5px 18px 10px;cursor:pointer;touch-action:none;border:0;background:transparent;width:100%;text-align:left}
.grab{display:block;width:36px;height:5px;border-radius:3px;background:rgba(127,127,132,.4);margin:2px auto 9px}
.sheet-head .peek-title{font-weight:700;font-size:1.12rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.sheet-head .peek-sub{color:var(--ink-2);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-body{overflow:auto;padding:4px 18px 26px;flex:1;min-height:0}
@media (max-width:899px){
  .panel{position:absolute;left:0;right:0;bottom:0;z-index:12;border-radius:14px 14px 0 0;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:0 -4px 24px rgba(0,0,0,.14);height:var(--sh,92px);transition:height .34s cubic-bezier(.2,.9,.2,1)}
  .panel[data-mode="peek"]{--sh:92px}
  .panel[data-mode="half"]{--sh:56%}
  .panel[data-mode="full"]{--sh:calc(100% - 10px)}
  .panel[data-mode="peek"] .panel-body{visibility:hidden}
}
@media (min-width:900px){
  .panel{border-left:.5px solid var(--sep);height:100%;background:var(--bg)}
  .sheet-head{display:none}
  .panel-body{padding:22px 22px 30px}
}
@media (prefers-reduced-motion:reduce){.panel,.view.enter .page{transition:none;animation:none}}
.kicker{color:var(--ink-2);font-size:.88rem;margin:0}
.panel h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.1;letter-spacing:-.03em;margin-bottom:.15em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;padding:0;list-style:none}
.tags li{display:inline-flex;align-items:center;gap:7px;background:var(--fill);border-radius:999px;padding:5px 11px;font-size:.84rem}
.ask{display:flex;gap:12px;align-items:flex-start;background:var(--blue-tint);border-radius:var(--r-m);padding:14px;margin:14px 0}
.ask h3{font-size:.98rem;margin:0 0 2px} .ask p{margin:0}
.src{font-size:.86rem;color:var(--ink-2);margin-top:18px}
.src h3{font-size:.92rem;color:var(--ink);margin-bottom:4px}
.src ol{margin:0;padding-left:20px} .src li{margin-bottom:4px}
.count{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:1;letter-spacing:-.04em;display:block;color:var(--blue)}
:root[data-theme="dark"] .count{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .count{color:var(--link)}}
.fine{font-size:.84rem;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--fill);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer;font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:12px;border:0;background:var(--fill);color:var(--link);cursor:pointer;font-weight:600;text-decoration:none;font-size:1rem}
:root[data-theme="dark"] .btn{color:var(--link)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:var(--link)}}
:root .btn.primary,:root[data-theme="dark"] .btn.primary{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#fff}}
.btn:hover{text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.block{width:100%}
.btn:active,.chips button:active,.ctrls button:active,.iconbtn:active,.tile:active,.depths label:active,.todo:active,.seg button:active,.row:active{opacity:.7}
.btn:disabled{opacity:.5;cursor:progress}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.rlist{list-style:none;margin:8px 0 0;padding:0;border-radius:var(--r-m);overflow:hidden;background:var(--fill)}
.rlist li{padding:12px 14px;border-bottom:.5px solid var(--sep)}
.rlist li:last-child{border-bottom:0}
.rlist .meta{font-size:.82rem;color:var(--ink-2)}
.depth-badge{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.community{margin-top:20px;padding-top:16px;border-top:.5px solid var(--sep)}

/* ---------- Report ---------- */
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-l);padding:12px 14px;margin:6px 0 14px;box-shadow:var(--sh1)}
.callout strong{color:var(--em);margin-right:auto}
.callout a{display:inline-flex;align-items:center;min-height:44px;padding:4px 18px;border-radius:999px;background:#D70015;color:#fff;font-weight:600}
.callout a:hover{text-decoration:none}
.demo{background:rgba(255,204,0,.18);padding:10px 14px;border-radius:var(--r-m);font-size:.88rem;margin-bottom:14px}
#rform{display:flex;flex-direction:column;gap:12px}
.step{background:var(--surface);border:0;border-radius:var(--r-l);box-shadow:var(--sh1);padding:16px;margin:0;min-width:0}
.step-h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.02rem;margin:0 0 12px;padding:0}
.stepn{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:.82rem;font-weight:700;flex:0 0 auto}
.field{margin:0 0 12px} .field:last-child{margin-bottom:0}
.field>label{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.hint{font-size:.84rem;color:var(--ink-2);margin:0 0 6px}
.step select,.step input[type=text],.step textarea{width:100%;padding:12px 14px;border:0;border-radius:10px;background:var(--fill);min-height:48px;-webkit-appearance:none;appearance:none}

.depths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.depths{grid-template-columns:repeat(4,minmax(0,1fr))}}
.depths label{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent;border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;font-size:.9rem;background:var(--fill);min-height:108px;justify-content:center}
.depths input{position:absolute;opacity:0;pointer-events:none}
.depths input:checked+label{border-color:var(--blue);background:var(--blue-tint)}
.depths input:checked+label span{font-weight:700}
.depths input:focus-visible+label{outline:3px solid var(--hl);outline-offset:2px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:24px;height:24px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--blue)}
.submitbar{position:sticky;bottom:0;padding:10px 0 6px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.success{background:var(--surface);border-radius:var(--r-l);padding:22px;margin-top:6px;box-shadow:var(--sh1);text-align:center}
.success h2{color:var(--ok);font-size:1.5rem}
.success .btnrow{justify-content:center}
.st{display:inline-block;font-size:.76rem;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--fill);margin-left:4px}
.st.ok{color:var(--ok);background:rgba(52,199,89,.16)}

/* ---------- TMA desk ---------- */
.tma-hero{display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,#4BA3F5 0%,#1A6FD6 55%,#0B4F9C 100%);color:#fff;border-radius:20px;padding:20px;margin:4px 0 8px;box-shadow:var(--sh2);position:relative;overflow:hidden}
.tma-hero .wx{position:absolute;right:14px;top:12px;width:64px;height:64px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.tma-hero h2{color:#fff;font-size:1.25rem;margin:0;max-width:calc(100% - 76px);min-height:56px}
.tma-hero p{margin:0;opacity:.95}
.tma-hero .btn,:root[data-theme="dark"] .tma-hero .btn{align-self:flex-start;background:#fff;color:#0058B0;margin-top:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tma-hero .btn{color:#0058B0}}
.list{background:var(--surface);border-radius:var(--r-l);overflow:hidden;margin:0;padding:0;list-style:none;box-shadow:var(--sh1)}
.list>li{border-bottom:.5px solid var(--sep);margin-left:0}
.list>li:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;color:var(--ink);text-decoration:none}

.row .chev{margin-left:auto;color:#C7C7CC}
.chan{display:block}
.verify{counter-reset:v}
.verify li{display:flex;gap:12px;align-items:center;padding:12px 16px}
.verify li::before{counter-increment:v;content:counter(v);flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:700;font-size:.82rem}
.sec{margin-top:6px}
.sec>h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-2);font-weight:400;margin:26px 16px 7px}
.sec>p{margin:0 16px 10px;color:var(--ink-2);font-size:.95rem}
.sharebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.copied{font-size:.9rem;color:var(--ok);font-weight:600}

/* ---------- Prepare ---------- */
.hero{margin:4px 0 16px;border-radius:20px;background:linear-gradient(160deg,#5AB4F7 0%,#1F78DB 60%,#0E5AAE 100%);box-shadow:var(--sh2);overflow:hidden;position:relative}
.hero>div{color:#fff;padding:22px 18px 18px;display:flex;align-items:center;gap:14px}
.hero .wx{width:72px;height:72px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.hero b{display:block;font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.12;letter-spacing:-.02em}
.hero span{display:block;margin-top:4px;opacity:.95;font-size:.92rem}
.hero span:empty{display:none}
.progress{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.prow{display:flex;flex-direction:column;gap:2px}
.prow strong{font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
.track{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#34C759,#30B94D);border-radius:999px;transition:width .3s ease}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--fill);border-radius:10px;padding:2px;margin:6px 0 14px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:44px;cursor:pointer;font-size:.88rem;color:var(--ink);padding:5px 8px;line-height:1.15}
.seg button small{display:block;font-size:.72rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--raised);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.phase-head{display:flex;align-items:center;gap:12px;margin:2px 4px 10px}
.phase-head .wx{width:44px;height:44px}
.phase-head h2{font-size:1.15rem;margin:0}
.todos{margin:0;padding:0;list-style:none}
.todo{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;cursor:pointer}
.todo input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:0 0 auto;border-radius:50%;border:1.8px solid #C7C7CC;display:grid;place-items:center;cursor:pointer;background:transparent}
.todo input:checked{background:#30B94D;border-color:#30B94D}
.todo input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.todo input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.todo:has(input:checked) span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-2)}

/* ---------- Health ---------- */
.danger{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh1);border-left:5px solid #FF3B30}

.danger li{margin:2px 0}
.accs{margin-top:14px;background:var(--surface);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh1)}
.acc{border-bottom:.5px solid var(--sep)}
.acc:last-child{border-bottom:0}
.acc summary{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;list-style:none;min-height:56px}
.acc summary::-webkit-details-marker{display:none}
.acc summary h2{flex:1;font-size:1rem;font-weight:500;margin:0;letter-spacing:-.01em}
.acc summary .chev{transition:transform .2s;color:#C7C7CC}
.acc[open] summary .chev{transform:rotate(180deg)}
.acc p{margin:0;padding:0 16px 14px 60px;color:var(--ink-2)}
@media (max-width:420px){.acc p{padding-left:16px}}

/* ---------- Emergency ---------- */
.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-police{--n:#64B5FF} :root:not([data-theme="light"]) .t-fire{--n:#FFB15C} :root:not([data-theme="light"]) .t-amb{--n:#FF6961} :root:not([data-theme="light"]) .t-dis{--n:#FFB340} :root:not([data-theme="light"]) .t-health{--n:#4CD964} :root:not([data-theme="light"]) .t-power{--n:#FFD60A}}
:root[data-theme="dark"] .t-police{--n:#64B5FF} :root[data-theme="dark"] .t-fire{--n:#FFB15C} :root[data-theme="dark"] .t-amb{--n:#FF6961} :root[data-theme="dark"] .t-dis{--n:#FFB340} :root[data-theme="dark"] .t-health{--n:#4CD964} :root[data-theme="dark"] .t-power{--n:#FFD60A}
.official li{padding:12px 16px}
.official h3{font-size:1rem;margin:0 0 2px}
.official p{margin:0;color:var(--ink-2);font-size:.95rem}
.srcs{font-size:.88rem;padding-left:20px} .srcs li{margin-bottom:6px}
.about-card{margin-bottom:12px}
.about-card p:last-child{margin-bottom:0}

/* ---------- Regions ---------- */
.natmap{position:absolute;left:12px;right:12px;top:12px;bottom:calc(56% + 8px)}
@media (min-width:900px){.natmap{inset:24px}}
.natmap svg{width:100%;height:100%;display:block}
.natmap .rg{fill:var(--land);stroke:var(--ward-line);stroke-width:2.5;stroke-linejoin:round}
.natmap .rg.on{fill:var(--blue)}
.natmap text{fill:var(--ink);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:10;stroke-linejoin:round}
.region-pick{margin:4px 0 14px}
.region-pick label{display:block;font-weight:600;margin-bottom:6px}
.region-pick select{width:100%;padding:12px 36px 12px 14px;border:0;border-radius:10px;background:var(--fill);min-height:48px;-webkit-appearance:none;appearance:none;font-size:1rem;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.region-pick .fine{margin:8px 0 0}
.btn:disabled{cursor:not-allowed}
.sw.ok{background:#30B94D;border-radius:50%}
#map .bub.ok circle{fill:#30B94D}
.depths label svg{width:30px;height:30px;flex:0 0 auto}
.depths label[for="d-clear"]{grid-column:1/-1;min-height:64px;flex-direction:row}
.depths label[for="d-clear"] svg{color:#30B94D}
.depths input:checked+label[for="d-clear"]{border-color:#30B94D;background:rgba(48,185,77,.14)}
.clear-badge{color:var(--ok)}

/* ---------- First-run sheet ---------- */
dialog{border:0;border-radius:22px;padding:0;max-width:min(440px,calc(100% - 28px));width:100%;background:var(--surface);color:var(--ink);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{padding:24px 22px 20px}
.dlg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.dlg .wx{width:64px;height:64px;margin:0 0 8px}
.dlg h2{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.1;letter-spacing:-.03em;margin:0}
.dlg ul{list-style:none;margin:12px 0 16px;padding:0;display:flex;flex-direction:column;gap:14px}
.dlg li{display:flex;gap:14px;align-items:center}
.dlg .note{font-size:.88rem;background:var(--fill);padding:12px 14px;border-radius:var(--r-m);color:var(--ink-2)}
</style>

const q = $("q"), ql = $("qlist"); let opts = [], active = -1;
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f'’\s-]/g, "");
function openList(){
  const v = norm(q.value); if (!v){ closeList(); return; }
  const sc = []; W.forEach((w, i) => { const ns = [norm(w.n)].concat((INFO[w.n] && INFO[w.n].alias) || []); let s = -1; ns.forEach(n => { if (n.startsWith(v)) s = Math.max(s, 2); else if (n.includes(v)) s = Math.max(s, 1); }); if (s >= 0) sc.push([s, i]); });
  sc.sort((a,b) => b[0]-a[0] || W[a[1]].n.localeCompare(W[b[1]].n)); opts = sc.slice(0, 8).map(x => x[1]); active = opts.length ? 0 : -1;
  ql.innerHTML = opts.length ? opts.map((i, j) => { const n = W[i].n, c = cls(n); return `<li role="option" id="opt${j}" data-i="${i}" aria-selected="${j === active}"><span><span class="sw ${c}" aria-hidden="true"></span> ${esc(n)} <small>${esc(W[i].d)}</small></span><small>${esc(c === "none" ? t("notListedShort") : t("listed"))}</small></li>`; }).join("")
    : `<li class="empty" role="option" aria-disabled="true" aria-selected="false">${esc(t("noMatch"))}</li>`;
  ql.hidden = false; q.setAttribute("aria-expanded","true"); if (active >= 0) q.setAttribute("aria-activedescendant","opt"+active); else q.removeAttribute("aria-activedescendant");
}
function closeList(){ ql.hidden = true; q.setAttribute("aria-expanded","false"); q.removeAttribute("aria-activedescendant"); }
function choose(i){ q.value = W[i].n; closeList(); q.blur(); select(i, {fit:true, open:true}); }
q.addEventListener("input", openList);
q.addEventListener("keydown", (e) => {
  if (ql.hidden && e.key === "ArrowDown"){ openList(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ if (!opts.length) return; e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
    ql.querySelectorAll("li").forEach((li, j) => li.setAttribute("aria-selected", j === active)); q.setAttribute("aria-activedescendant","opt"+active); }
  else if (e.key === "Enter"){ if (active >= 0 && opts.length){ e.preventDefault(); choose(opts[active]); } }
  else if (e.key === "Escape"){ closeList(); }
});
ql.addEventListener("mousedown", (e) => e.preventDefault());
ql.addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (li) choose(+li.dataset.i); });
q.addEventListener("blur", () => setTimeout(closeList, 120));
