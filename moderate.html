<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Salama Dar: kagua ripoti / review reports</title>
<style>
:root{--paper:#F2F2F7;--paper-2:#E5E5EA;--raised:#fff;--ink:#1D1D1F;--ink-2:#636366;--rule:rgba(60,60,67,.18);--flood:#0071E3;--plan:#FFC53D;--em:#D70015;--ok:#1E7B34;
  --frame:#16324F;--frame-dot:#E3AF6D;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F171D;--paper-2:#16212A;--raised:#1A2630;--ink:#E4ECF0;--ink-2:#A2B4BF;--rule:#2C3B45;--flood:#E4893D;--plan:#8E5F2D;--em:#FF8A80;--ok:#6FCF97;--frame:#1D3A59;--frame-dot:#D99A52;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F171D;--paper-2:#16212A;--raised:#1A2630;--ink:#E4ECF0;--ink-2:#A2B4BF;--rule:#2C3B45;--flood:#E4893D;--plan:#8E5F2D;--em:#FF8A80;--ok:#6FCF97;--frame:#1D3A59;--frame-dot:#D99A52;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16.5px;line-height:1.5}
:focus-visible{outline:3px solid var(--flood);outline-offset:2px}
.strip{height:4px;background:linear-gradient(90deg,#6CC4FF,#0A6FE0)}
.wrap{max-width:760px;margin:0 auto;padding:18px}
h1{font-weight:700;font-size:2rem;letter-spacing:-.03em;margin:4px 0 6px;line-height:1}
h2{font-size:1.2rem;margin:26px 0 8px}
.muted{color:var(--ink-2)}
.box{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:16px}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=email]{width:100%;padding:12px 14px;border:1.5px solid var(--ink-2);border-radius:10px;min-height:48px;background:var(--raised);color:var(--ink);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:8px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:#0071E3;color:#fff;border-color:#0071E3}
.btn.ok{border-color:var(--ok);color:var(--ok)} .btn.no{border-color:var(--em);color:var(--em)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
ul{list-style:none;margin:0;padding:0}
li.rep{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:10px}
.meta{font-size:.86rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
.note{background:var(--paper-2);border-left:4px solid var(--plan);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.msg{font-weight:700;margin-top:10px} .msg.err{color:var(--em)}
code{background:var(--paper-2);padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<main class="wrap">
  <p class="muted"><a href="./">← Salama Dar</a></p>
  <h1>Kagua ripoti</h1>
  <p class="muted">Review community reports. Idhinisha tu ripoti zinazoeleweka na zinazohusu mafuriko yanayotokea sasa. Approve only clear reports about flooding happening now.</p>
  <div id="app"></div>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG = (window.SALAMA_CONFIG && window.SALAMA_CONFIG.supabaseUrl && window.SALAMA_CONFIG.supabaseAnonKey) ? window.SALAMA_CONFIG : null;
const DEPTH = {clear:"Inapitika, hakuna maji / Passable, no water", ankle:"Hadi kifundoni / Ankle deep", knee:"Hadi magotini / Knee deep", waist:"Kiunoni au zaidi / Waist deep or more", road:"Barabara haipitiki / Road impassable"};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");
const fmt = (iso) => new Date(iso).toLocaleString("sw-TZ", {dateStyle:"medium", timeStyle:"short"});
function card(r, actions){
  return `<li class="rep"><strong>${esc(r.ward)}</strong> <span class="tag">${esc(DEPTH[r.depth] || r.depth)}</span>
    ${r.place ? `<div>${esc(r.place)}</div>` : ""}${r.note ? `<div>${esc(r.note)}</div>` : ""}
    <div class="meta">${esc(fmt(r.created_at))}${r.lang ? " (" + esc(r.lang) + ")" : ""}</div>
    <div class="row">${actions(r)}</div></li>`;
}
function lists(pending, live, act){
  app.innerHTML = `<h2>Zinasubiri ukaguzi / Waiting (${pending.length})</h2>` +
    (pending.length ? `<ul>${pending.map(r => card(r, x => `<button class="btn ok" data-a="approved" data-id="${x.id}">Idhinisha / Approve</button><button class="btn no" data-a="rejected" data-id="${x.id}">Kataa / Reject</button>`)).join("")}</ul>` : `<p class="muted">Hakuna ripoti mpya. Nothing waiting.</p>`) +
    `<h2>Ziko kwenye ramani, saa 24 / Live, last 24 h (${live.length})</h2>` +
    (live.length ? `<ul>${live.map(r => card(r, x => `<button class="btn no" data-a="rejected" data-id="${x.id}">Ondoa / Remove</button>`)).join("")}</ul>` : `<p class="muted">Hakuna. None.</p>`);
  app.querySelectorAll("button[data-a]").forEach(b => b.addEventListener("click", async () => { b.disabled = true; await act(b.dataset.id, b.dataset.a); }));
}

/* ---------- Demo mode: this browser only ---------- */
function demo(){
  const get = () => { try { return JSON.parse(localStorage.getItem("salamadar-demo-reports") || "[]"); } catch (e) { return []; } };
  const put = (a) => { try { localStorage.setItem("salamadar-demo-reports", JSON.stringify(a)); } catch (e) {} };
  const draw = () => { const a = get(), since = Date.now() - 864e5;
    lists(a.filter(r => r.status === "pending").sort((x,y) => y.created_at.localeCompare(x.created_at)),
          a.filter(r => r.status === "approved" && Date.parse(r.created_at) >= since),
          async (id, st) => { const b = get(); const x = b.find(r => r.id === id); if (x) x.status = st; put(b); draw(); }); };
  app.insertAdjacentHTML("beforebegin", `<p class="note">Hali ya majaribio: unakagua ripoti zilizohifadhiwa kwenye kivinjari hiki tu. Demo mode: reviewing reports stored in this browser only.</p>`);
  draw();
}

/* ---------- Live mode: Supabase ---------- */
async function live(){
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  const signIn = () => {
    app.innerHTML = `<div class="box"><form id="f"><label for="em">Barua pepe / Email</label><input type="email" id="em" required autocomplete="email">
      <div class="row"><button class="btn primary" type="submit">Nitumie kiungo / Send me a sign-in link</button></div><p class="msg" id="m" role="status"></p></form></div>`;
    document.getElementById("f").addEventListener("submit", async (e) => { e.preventDefault(); const m = document.getElementById("m");
      const {error} = await sb.auth.signInWithOtp({email: document.getElementById("em").value.trim(), options:{emailRedirectTo: location.href.split("#")[0]}});
      m.className = "msg" + (error ? " err" : ""); m.textContent = error ? ("Imeshindikana / Failed: " + error.message) : "Angalia barua pepe yako. Check your email for the link."; });
  };
  const {data:{session}} = await sb.auth.getSession();
  if (!session){ signIn(); sb.auth.onAuthStateChange((_e, s) => { if (s) location.reload(); }); return; }
  const uid = session.user.id;
  const {data: mod} = await sb.from("moderators").select("user_id").eq("user_id", uid).maybeSingle();
  if (!mod){ app.innerHTML = `<div class="box"><p><strong>Akaunti hii si ya mkaguzi bado. This account is not a reviewer yet.</strong></p><p>Mpe msimamizi namba hii / Send the admin this ID:</p><p><code>${esc(uid)}</code></p><div class="row"><button class="btn" id="out">Toka / Sign out</button></div></div>`;
    document.getElementById("out").onclick = async () => { await sb.auth.signOut(); location.reload(); }; return; }
  const draw = async () => {
    const since = new Date(Date.now() - 864e5).toISOString();
    const [p, l] = await Promise.all([
      sb.from("reports").select("*").eq("status","pending").order("created_at",{ascending:false}).limit(200),
      sb.from("reports").select("*").eq("status","approved").gte("created_at", since).order("created_at",{ascending:false}).limit(200)]);
    if (p.error || l.error){ app.innerHTML = `<p class="msg err">Imeshindikana kupakia / Could not load: ${esc((p.error||l.error).message)}</p>`; return; }
    lists(p.data, l.data, async (id, st) => {
      const {error} = await sb.from("reports").update({status: st, reviewed_at: new Date().toISOString(), reviewed_by: uid}).eq("id", id);
      if (error) alert("Imeshindikana / Failed: " + error.message); draw(); });
  };
  draw(); setInterval(draw, 60000);
}
CFG && window.supabase ? live() : demo();
</script>
</body>
</html>
